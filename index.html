<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0F16">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Precisão na minuta, agilidade no gabinete.">
<title>Assistente de Minuta</title>
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   Assistente de Minuta — instrumento de precisão.

   O escuro e o mundo assumido: e um aparelho, nao um documento -- e um aparelho
   nao muda de cara porque o sistema operacional mudou de humor. Houve aqui uma
   variante clara, atada a `prefers-color-scheme`; ela saiu. O `color-scheme:dark`
   abaixo nao e detalhe: e o que faz o navegador desenhar barra de rolagem, area
   de arrasto e controles de formulario no escuro tambem, em vez de abrir faixas
   brancas em volta de uma pagina preta quando o tema do sistema esta claro.
   ═══════════════════════════════════════════════════════════════════════════ */
:root{
  color-scheme:dark;
  --breu:#0A0F16; --painel:#111927; --alto:#17212F; --linha:#1F2A3A;
  --tinta:#E2E9F2; --suave:#8595AB; --fraco:#4C5A6E;
  --menta:#6FDDBB; --ambar:#E9B04C; --coral:#E2695C; --safira:#5FA8E8;
  --sombra:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--breu); color:var(--tinta); font-family:var(--ui);
  font-size:16px; line-height:1.5; min-height:100dvh;
  -webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.wrap{max-width:32rem;margin:0 auto;padding:1.6rem 1.15rem 4rem;
      display:flex;flex-direction:column;gap:1.9rem}

/* ── a cabeça ───────────────────────────────────────────────────────────────
   A marca e CONSTRUIDA, nao so composta: peso alto com entreletra negativa, um
   fio embaixo, e o lema pendurado nele. O contraste entre esse bloco denso e os
   micro-rotulos largos e a personalidade da pagina.

   UMA LINHA, sempre. O `nowrap` proibe a quebra e o clamp em vw da ao titulo por
   onde encolher em vez dela: 20 caracteres em caixa-alta so cabem em 320px se a
   fonte puder ceder. O peso menor de "de Minuta" e o que ainda separa o nome do
   complemento agora que eles dividem a mesma linha. */
header{display:flex;flex-direction:column;gap:.85rem}
.marca{
  font-size:clamp(1.2rem,7.2vw,1.8rem); font-weight:760; line-height:1.05;
  letter-spacing:-.035em; text-transform:uppercase; white-space:nowrap;
}
.marca em{font-style:normal;color:var(--suave);font-weight:600}
.regua-marca{height:1px;background:var(--linha);position:relative}
.regua-marca::after{content:"";position:absolute;left:0;top:0;width:2.6rem;height:1px;background:var(--menta)}
.lema{font-size:.775rem;color:var(--suave)}

/* estado dos sistemas: chips, nao pontinhos soltos */
.sinais{display:flex;flex-wrap:wrap;gap:.4rem}
.sinal{
  display:inline-flex;align-items:center;gap:.4rem;background:var(--painel);
  border:1px solid var(--linha);border-radius:2rem;padding:.3rem .6rem .3rem .5rem;
  font-size:.68rem;color:var(--suave);white-space:nowrap;
}
.sinal b{font-weight:600;color:var(--tinta);font-variant-numeric:tabular-nums}
.bolha{width:.42rem;height:.42rem;border-radius:50%;background:var(--fraco);flex:none}
.bolha.ok{background:var(--menta);box-shadow:0 0 0 3px color-mix(in srgb,var(--menta) 18%,transparent)}
.bolha.alerta{background:var(--ambar);box-shadow:0 0 0 3px color-mix(in srgb,var(--ambar) 18%,transparent)}
.bolha.ruim{background:var(--coral);box-shadow:0 0 0 3px color-mix(in srgb,var(--coral) 18%,transparent)}

/* ── a bancada ──────────────────────────────────────────────────────────────
   Toda a ousadia da pagina mora aqui. O numero CNJ ocupa a largura inteira em
   monoespacado grande, com uma ESCALA GRAVADA embaixo nomeando os seis campos --
   cada rotulo ancorado na coluna exata do seu campo. Nao e enfeite: ensina o que
   se digita enquanto confere. */
.bancada{background:var(--painel);border:1px solid var(--linha);border-radius:.85rem;
         box-shadow:var(--sombra);padding:1.35rem 1.2rem 1.25rem;
         display:flex;flex-direction:column;gap:1.25rem}
.rotulo{font-size:.615rem;letter-spacing:.17em;text-transform:uppercase;
        color:var(--suave);display:block;font-weight:560}

.campo{display:flex;flex-direction:column;gap:.55rem}
.leitor{position:relative}
#numero{
  width:100%;background:transparent;border:0;outline:0;color:var(--tinta);
  font-family:var(--mono);letter-spacing:.01em;padding:.3rem 0 .55rem;
  font-size:clamp(.95rem,calc((100vw - 4.6rem)/16),1.34rem);
  font-variant-numeric:tabular-nums;caret-color:var(--menta);
}
#numero::placeholder{color:var(--fraco)}
.trilho{height:2px;background:var(--linha);position:relative;overflow:hidden;border-radius:2px}
.trilho::after{content:"";position:absolute;inset:0;background:var(--menta);
               transform:scaleX(0);transform-origin:left;
               transition:transform .34s cubic-bezier(.2,.8,.25,1)}
.conferido .trilho::after{transform:scaleX(1)}
.conferido #numero{color:var(--menta)}

/* --col e a largura de UM caractere do mostrador, medida em JS. Nao da para usar
   `ch`: numa filha, `ch` resolve contra a fonte DA FILHA, nao a do numero. */
.escala{position:relative;height:.9rem}
.escala b{
  position:absolute;top:0;font-family:var(--ui);font-size:.545rem;font-weight:500;
  letter-spacing:.13em;text-transform:uppercase;color:var(--fraco);
  transition:color .28s ease;white-space:nowrap
}
.escala b::before{content:"";position:absolute;left:0;top:-.36rem;width:1px;height:.24rem;
                  background:var(--linha);transition:background .28s ease}
.escala .seq{left:0}                     .escala .dv {left:calc(8  * var(--col))}
.escala .ano{left:calc(11 * var(--col))} .escala .jus{left:calc(16 * var(--col))}
.escala .tri{left:calc(18 * var(--col))} .escala .uni{left:calc(21 * var(--col))}
.conferido .escala .dv{color:var(--menta)}
.conferido .escala .dv::before{background:var(--menta)}

.aviso{font-size:.76rem;color:var(--ambar);min-height:1.15rem;line-height:1.4}
.conferido .aviso,.confirmado .aviso{color:var(--menta)}

/* seletor: controle segmentado, com o indicador deslizando de verdade */
.pipes{position:relative;display:grid;grid-template-columns:repeat(3,1fr);
       background:var(--alto);border:1px solid var(--linha);border-radius:.6rem;padding:.22rem}
.polegar{position:absolute;top:.22rem;bottom:.22rem;left:.22rem;width:calc((100% - .44rem)/3);
         background:var(--painel);border:1px solid var(--linha);border-radius:.45rem;
         box-shadow:var(--sombra);
         transition:transform .3s cubic-bezier(.3,1.2,.4,1);pointer-events:none}
.pipes button{
  position:relative;z-index:1;background:none;border:0;color:var(--suave);
  padding:.55rem .2rem;font:inherit;font-size:.775rem;font-weight:500;cursor:pointer;
  border-radius:.45rem;transition:color .22s ease
}
.pipes button[aria-pressed=true]{color:var(--tinta);font-weight:600}
.pipes button:focus-visible{outline:2px solid var(--menta);outline-offset:1px}
.faz{font-size:.755rem;color:var(--suave);line-height:1.5;min-height:2.3rem}

.acionar{
  width:100%;background:var(--menta);color:var(--breu);border:0;border-radius:.55rem;
  padding:.95rem;font:inherit;font-weight:700;font-size:.9rem;letter-spacing:.09em;
  text-transform:uppercase;cursor:pointer;
  transition:opacity .2s ease,transform .12s ease
}
.acionar:active:not(:disabled){transform:scale(.985)}
.acionar:disabled{background:var(--alto);color:var(--fraco);cursor:not-allowed}
.acionar:focus-visible{outline:2px solid var(--tinta);outline-offset:2px}

/* ── o feed ─────────────────────────────────────────────────────────────────
   O estado e uma PILULA e um fio superior, nao uma barra lateral -- barra de
   acento em cartao arredondado e o clichê visual do momento. */
.fila{display:flex;flex-direction:column;gap:.75rem}
.cartao{position:relative;background:var(--painel);border:1px solid var(--linha);
        border-radius:.7rem;padding:.95rem 1rem;overflow:hidden;box-shadow:var(--sombra);
        display:flex;flex-direction:column;gap:.55rem}
.cartao::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--fraco)}
.cartao[data-estado=executando]::before{background:var(--safira);
  background-image:linear-gradient(90deg,transparent,color-mix(in srgb,var(--safira) 25%,transparent),transparent);
  background-size:40% 100%;background-repeat:no-repeat;animation:varrer 1.9s linear infinite}
.cartao[data-estado=aguardando]::before{background:var(--ambar)}
.cartao[data-estado=concluido]::before{background:var(--menta)}
.cartao[data-estado=falhou]::before,.cartao[data-estado=recusado]::before{background:var(--coral)}
@keyframes varrer{from{background-position:-45% 0}to{background-position:145% 0}}

.proc{font-family:var(--mono);font-size:.845rem;font-variant-numeric:tabular-nums;
      line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.linha2{display:flex;justify-content:space-between;align-items:center;gap:.7rem;margin-top:.3rem}
.meta{font-size:.68rem;color:var(--fraco);font-variant-numeric:tabular-nums}
.pill{flex:none;font-size:.635rem;font-weight:650;letter-spacing:.07em;text-transform:uppercase;
      padding:.24rem .55rem;border-radius:2rem;border:1px solid var(--linha);color:var(--suave);
      background:var(--alto);white-space:nowrap}
.cartao[data-estado=executando] .pill{color:var(--safira);border-color:color-mix(in srgb,var(--safira) 40%,transparent)}
.cartao[data-estado=aguardando] .pill{color:var(--ambar);border-color:color-mix(in srgb,var(--ambar) 45%,transparent)}
.cartao[data-estado=concluido] .pill{color:var(--menta);border-color:color-mix(in srgb,var(--menta) 40%,transparent)}
.cartao[data-estado=falhou] .pill,.cartao[data-estado=recusado] .pill{
  color:var(--coral);border-color:color-mix(in srgb,var(--coral) 42%,transparent)}

.pergunta{font-size:.845rem;line-height:1.5;border-top:1px solid var(--linha);
          margin-top:.15rem;padding-top:.7rem}
.opcoes{display:flex;flex-direction:column;gap:.4rem}
.opcoes button{
  background:var(--alto);border:1px solid var(--linha);color:var(--tinta);text-align:left;
  border-radius:.5rem;padding:.65rem .75rem;font:inherit;font-size:.815rem;cursor:pointer;
  line-height:1.4;transition:border-color .18s ease,background .18s ease
}
.opcoes button:hover:not(:disabled){border-color:var(--ambar)}
.opcoes button:focus-visible{outline:2px solid var(--ambar);outline-offset:1px}
.opcoes button:disabled{opacity:.4;cursor:not-allowed}
.opcoes button.escolhida{opacity:1;border-color:var(--menta);color:var(--menta);font-weight:560}
.vazio{color:var(--fraco);font-size:.855rem;line-height:1.5;
       border:1px dashed var(--linha);border-radius:.7rem;padding:1.1rem 1rem;text-align:center}

/* ── ajustes ────────────────────────────────────────────────────────────────*/
details{border-top:1px solid var(--linha);padding-top:1.1rem}
summary{font-size:.615rem;letter-spacing:.17em;text-transform:uppercase;color:var(--suave);
        cursor:pointer;font-weight:560;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:" +";color:var(--fraco)}
details[open] summary::after{content:" −"}
details input{
  width:100%;margin-top:.75rem;background:var(--alto);border:1px solid var(--linha);
  border-radius:.5rem;padding:.65rem .75rem;color:var(--tinta);font:inherit;font-size:.85rem
}
details input:focus{outline:2px solid var(--menta);outline-offset:1px}
details p{font-size:.755rem;color:var(--fraco);margin-top:.7rem;line-height:1.55}
details p.cofre{color:var(--suave)}
details p.cofre.alerta{color:var(--ambar)}

/* Entrada em sequencia: cabeca, bancada, fila. Um momento so, na carga. */
@keyframes surgir{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
header,.bancada,.fila,details{animation:surgir .5s cubic-bezier(.2,.8,.25,1) both}
.bancada{animation-delay:.06s} .fila{animation-delay:.12s} details{animation-delay:.16s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1 class="marca">Assistente <em>de Minuta</em></h1>
  <div class="regua-marca"></div>
  <p class="lema">Precisão na minuta, agilidade no gabinete</p>
  <div class="sinais" id="sinais"></div>
</header>

<section class="bancada">
  <div class="campo">
    <span class="rotulo">Número do processo</span>
    <div class="leitor" id="leitor">
      <input id="numero" inputmode="numeric" autocomplete="off" spellcheck="false"
             placeholder="0000000-00.0000.0.00.0000" aria-describedby="aviso">
      <div class="trilho"></div>
      <div class="escala" aria-hidden="true">
        <b class="seq">sequencial</b><b class="dv">dv</b><b class="ano">ano</b><b
         class="jus">j</b><b class="tri">tr</b><b class="uni">unid</b>
      </div>
    </div>
    <p class="aviso" id="aviso" role="status"></p>
  </div>

  <div class="campo">
    <span class="rotulo">O que fazer</span>
    <div class="pipes" id="pipes"><div class="polegar" id="polegar"></div></div>
    <p class="faz" id="faz"></p>
  </div>

  <button class="acionar" id="acionar" disabled>Minutar</button>
</section>

<section class="fila" id="lista"></section>

<details>
  <summary>Ajustes</summary>
  <input id="repo" placeholder="murillodavidbrito/superjurista-pedidos" autocapitalize="off" spellcheck="false">
  <input id="token" type="password" placeholder="cole aqui o token (começa com github_pat_)" autocomplete="off">
  <p>O token fica só neste aparelho. Dê a ele escopo <em>Issues: read &amp; write</em> num
     repositório e nada mais — em especial, nada de <em>Contents</em>.</p>
</details>

</div>

<script>
'use strict';

/* ------------------------------------------------------------------ *
 * O digito verificador do numero CNJ (modulo 97, ISO 7064).
 * Mesma formula do scripts/lib/pedido.py -- a paridade entre as duas foi
 * conferida em 6.000 numeros, com zero divergencias.
 * Aqui e conveniencia: quem decide de verdade e o guarda, no Mac.
 * ------------------------------------------------------------------ */
const RE_CNJ = /^(\d{7})-(\d{2})\.(\d{4})\.(\d)\.(\d{2})\.(\d{4})$/;

function digitoVerificador(n){
  const m = RE_CNJ.exec(n);
  if(!m) return null;
  const [,seq,,ano,seg,trib,org] = m;
  let r = 0;                                   // mod 97 digito a digito: o numero
  for(const c of seq+ano+seg+trib+org+'00')    // inteiro estoura o Number do JS
    r = (r*10 + (+c)) % 97;
  return 98 - r;
}
function numeroConfere(n){
  const m = RE_CNJ.exec(n);
  return !!m && +m[2] === digitoVerificador(n);
}

/* Mascara: so digitos entram; a pontuacao aparece sozinha. */
function formatar(bruto){
  const d = bruto.replace(/\D/g,'').slice(0,20);
  let s = d.slice(0,7);
  if(d.length>7)  s += '-' + d.slice(7,9);
  if(d.length>9)  s += '.' + d.slice(9,13);
  if(d.length>13) s += '.' + d.slice(13,14);
  if(d.length>14) s += '.' + d.slice(14,16);
  if(d.length>16) s += '.' + d.slice(16,20);
  return s;
}

const PIPELINES = [
  {id:'pje',       nome:'Minutar PJe',
   faz:'Acessa os autos no PJe, analisa o processo e elabora a minuta da peça cabível.'},
  {id:'seeu',      nome:'Minutar SEEU',
   faz:'Acessa os autos no SEEU, analisa o processo e elabora a minuta da peça cabível.'},
  {id:'audiencia', nome:'Relatório AIJ',
   faz:'Acessa os autos, analisa o processo e elabora relatório completo para a audiência.'},
];
const ESTADOS = {
  enfileirado:'na fila', executando:'trabalhando', aguardando:'precisa de você',
  concluido:'pronto', nada_a_fazer:'nada a fazer', falhou:'falhou', recusado:'recusado',
};

const $ = s => document.querySelector(s);

/* Onde guardar o token. Nem todo navegador de celular deixa o localStorage
   sobreviver: navegacao privada, "limpar ao sair" e a limpeza automatica do iOS
   apagam. Entao a pagina TESTA o que tem e diz ao usuario o que conseguiu, em vez
   de perder a configuracao em silencio e deixar ele achando que digitou errado. */
const cofre = (() => {
  for (const [nome, alvo] of [['permanente','localStorage'], ['sessao','sessionStorage']]) {
    try {
      const s = window[alvo], k = '__sj_teste__';
      s.setItem(k,'1'); const ok = s.getItem(k) === '1'; s.removeItem(k);
      if (ok) return {nome, ler: k => s.getItem(k) || '', gravar: (k,v) => s.setItem(k,v)};
    } catch { /* bloqueado: tenta o proximo */ }
  }
  const mem = {};
  return {nome:'memoria', ler: k => mem[k] || '', gravar: (k,v) => { mem[k] = v; }};
})();

const cfg = {
  get repo(){ return cofre.ler('sj.repo'); },   set repo(v){ cofre.gravar('sj.repo', v); },
  get token(){ return cofre.ler('sj.token'); }, set token(v){ cofre.gravar('sj.token', v); },
};

const AVISO_COFRE = {
  permanente: '',
  sessao: 'Este navegador não guarda dados entre visitas — provavelmente aba privada. ' +
          'O token vale só enquanto esta aba estiver aberta.',
  memoria: 'Este navegador está bloqueando o armazenamento. O token some ao recarregar. ' +
           'Saia da navegação privada, ou adicione esta página à tela de início.',
};

let pipeline = 'pje';
let insistindo = null;
const demo = new URLSearchParams(location.search).has('demo');

/* Mede a largura de um caractere do mostrador e publica como --col, para a escala
   ancorar cada rotulo na coluna exata do seu campo. Medir e melhor que supor 0.6em:
   sobrevive a troca de fonte e ao ajuste de tamanho de texto do sistema. */
function medirColuna(){
  const alvo = getComputedStyle($('#numero'));
  const p = document.createElement('span');
  p.style.cssText = 'position:absolute;visibility:hidden;white-space:pre';
  p.style.font = alvo.font || `${alvo.fontSize} ${alvo.fontFamily}`;
  p.style.letterSpacing = alvo.letterSpacing;
  p.textContent = '0'.repeat(20);
  document.body.append(p);
  document.documentElement.style.setProperty('--col', p.getBoundingClientRect().width / 20 + 'px');
  p.remove();
}

function aoDigitar(){
  const el = $('#numero');
  el.value = formatar(el.value);
  const n = el.value, cheio = RE_CNJ.test(n), ok = numeroConfere(n);
  $('.bancada').classList.toggle('conferido', ok);
  $('#aviso').textContent = ok ? 'Número confere.'
    : cheio ? 'O dígito verificador não bate — confira antes de minutar.' : '';
  $('#acionar').disabled = !ok;
  if(insistindo && insistindo !== n) insistindo = null;
}

/* ---- GitHub ---- */
async function api(caminho, opcoes = {}){
  const r = await fetch(`https://api.github.com/repos/${cfg.repo}${caminho}`, {
    ...opcoes,
    headers:{Authorization:`Bearer ${cfg.token}`, Accept:'application/vnd.github+json',
             'Content-Type':'application/json', ...(opcoes.headers||{})},
  });
  if(!r.ok) throw new Error(`GitHub respondeu ${r.status}`);
  return r.json();
}

/* Ja existe pedido aberto para este processo? Nao BLOQUEIA -- minutar e depois
   entregar e legitimo -- mas exige um segundo toque, para minutar duas vezes ser
   escolha e nao duvida. */
async function jaNaFila(numero){
  try{
    const issues = await api('/issues?labels=pedido&state=open&per_page=30');
    return issues.find(i => (i.body || '').includes(numero));
  }catch{ return null; }
}

async function acionar(){
  const numero = $('#numero').value;
  const nome = (PIPELINES.find(p => p.id === pipeline) || {}).nome || pipeline;
  const botao = $('#acionar');

  if(insistindo !== numero){
    const aberto = await jaNaFila(numero);
    if(aberto){
      insistindo = numero;
      $('#aviso').textContent =
        `Já existe o pedido #${aberto.number} para este processo, em andamento. ` +
        `Toque de novo para acionar "${nome}" assim mesmo.`;
      return;
    }
  }
  insistindo = null;

  botao.disabled = true; botao.textContent = 'Enviando…';
  try{
    const criada = await api('/issues', {method:'POST', body: JSON.stringify({
      title: `${pipeline} · ${numero}`,
      body: `pipeline: ${pipeline}\nnumero: ${numero}\n`,
      labels: ['pedido','enfileirado'],
    })});
    $('#numero').value = ''; aoDigitar();
    /* A confirmacao fica AQUI, colada no campo. O cartao novo aparece na fila,
       mas num celular a fila esta fora da tela -- e quem nao ve confirmacao
       aciona de novo. */
    $('#aviso').textContent = `Pedido #${criada.number} na fila: ${nome}.`;
    $('.bancada').classList.add('confirmado');
    setTimeout(() => $('.bancada').classList.remove('confirmado'), 6000);
    await carregarFila();
  }catch(e){
    $('#aviso').textContent = `Não deu para enviar: ${e.message}`;
  }finally{
    botao.textContent = 'Minutar';
    botao.disabled = !numeroConfere($('#numero').value);
  }
}

/* Responder e IRREVERSIVEL na pratica: o pipeline retoma com a escolha. Entao os
   botoes morrem no primeiro toque -- sem isso o usuario toca de novo, e ja
   aconteceu de um dos toques cair numa opcao DIFERENTE. */
async function responder(caixa, issue, indice, texto, botao){
  caixa.querySelectorAll('button').forEach(b => { b.disabled = true; });
  const antes = botao.textContent;
  botao.textContent = 'Enviando…';
  try{
    await api(`/issues/${issue}/comments`, {method:'POST', body: JSON.stringify({
      body: `<!--superjurista:resposta:${indice}-->\nEscolhi: **${texto}**`,
    })});
    botao.textContent = `Respondido: ${antes}`;
    botao.classList.add('escolhida');
    await carregarFila();
  }catch(e){
    botao.textContent = antes;
    caixa.querySelectorAll('button').forEach(b => { b.disabled = false; });
    const erro = document.createElement('p');
    erro.className = 'pergunta'; erro.style.color = 'var(--coral)';
    erro.textContent = `Não deu para responder: ${e.message}. Tente de novo.`;
    caixa.after(erro);
  }
}

/* A pergunta vem no comentario que o executor publicou. Ler dali evita inventar
   um segundo canal: o que a pagina mostra e exatamente o que o Mac disse. */
function extrairPergunta(corpo){
  if(!corpo || !corpo.startsWith('**Precisa de voce**')) return null;
  const linhas = corpo.split('\n').filter(l => l.trim());
  const opcoes = []; let texto = '';
  for(const l of linhas.slice(1)){
    const m = /^(\d+)\.\s+(.*)$/.exec(l);
    if(m) opcoes.push(m[2]); else if(!opcoes.length) texto += (texto?' ':'') + l;
  }
  return opcoes.length ? {texto, opcoes} : null;
}

function estadoDe(rotulos){
  for(const e of Object.keys(ESTADOS)) if(rotulos.includes(e)) return e;
  return 'enfileirado';
}

function desde(iso){
  if(!iso) return '';
  const min = Math.round((Date.now() - new Date(iso)) / 60000);
  if(min < 1)  return 'agora';
  if(min < 60) return `há ${min} min`;
  const h = Math.floor(min/60);
  return h < 24 ? `há ${h}h${String(min%60).padStart(2,'0')}` : `há ${Math.floor(h/24)} d`;
}

function cartao(p){
  const el = document.createElement('article');
  el.className = 'cartao'; el.dataset.estado = p.estado;

  /* O numero fica com a linha inteira: e identificador, nao pode quebrar. A
     pilula desce para a linha do meta, onde sobra espaco. */
  const cab = document.createElement('div');
  const proc = document.createElement('div'); proc.className = 'proc';
  proc.textContent = p.processo || '—';
  const l2 = document.createElement('div'); l2.className = 'linha2';
  const meta = document.createElement('span'); meta.className = 'meta';
  meta.textContent = [`#${p.numero}`, desde(p.quando)].filter(Boolean).join(' · ');
  const pill = document.createElement('span'); pill.className = 'pill';
  pill.textContent = ESTADOS[p.estado] || p.estado;
  l2.append(meta, pill);
  cab.append(proc, l2);
  el.append(cab);

  if(p.pergunta){
    const q = document.createElement('p'); q.className = 'pergunta';
    q.textContent = p.pergunta.texto; el.append(q);
    const caixa = document.createElement('div'); caixa.className = 'opcoes';
    p.pergunta.opcoes.forEach((o,i) => {
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = o;
      b.onclick = () => demo ? (b.textContent = `Respondido: ${o}`)
                             : responder(caixa, p.numero, i, o, b);
      caixa.append(b);
    });
    el.append(caixa);
  }
  return el;
}

function pintarFila(pedidos, recado){
  const lista = $('#lista');
  lista.replaceChildren();
  if(recado || !pedidos.length){
    const v = document.createElement('p'); v.className = 'vazio';
    v.textContent = recado || 'Nada na fila. Comece por um número acima.';
    lista.append(v); return;
  }
  pedidos.forEach(p => lista.append(cartao(p)));
}

async function carregarFila(){
  if(demo) return pintarFila(FILA_DEMO);
  if(!cfg.repo || !cfg.token)
    return pintarFila([], 'Falta ligar a fila: preencha o repositório e o token logo abaixo, em Ajustes.');
  try{
    const issues = await api('/issues?labels=pedido&state=open&per_page=30');
    const pedidos = await Promise.all(issues.map(async i => {
      const rotulos = i.labels.map(l => l.name);
      const estado = estadoDe(rotulos);
      let pergunta = null;
      if(estado === 'aguardando'){
        const cs = await api(`/issues/${i.number}/comments?per_page=100`);
        for(const c of cs) pergunta = extrairPergunta(c.body) || pergunta;
      }
      return {numero:i.number, processo:(/numero:\s*(\S+)/.exec(i.body||'')||[])[1],
              estado, pergunta, quando:i.updated_at};
    }));
    pintarFila(pedidos);
  }catch(e){
    pintarFila([], `Não deu para ler a fila: ${e.message}`);
  }
}

/* ---- semaforo: le o que o Mac publica ---- */
const DEMO_SESSOES = {
  batimento: new Date().toISOString(),
  sessoes: {
    'PJe':        {nivel:'ok',    ate:'2h52', nota:''},
    'SEEU':       {nivel:'aviso', ate:'',     nota:'sem vigia de sessão'},
    'PJe Mídias': {nivel:'ok',    ate:'',     nota:''},
  },
};

/* Ha quanto tempo o Mac nao publica. E a unica coisa que distingue "nada
   acontecendo" de "o Mac esta desligado". */
function idadeDoBatimento(iso){
  if(!iso) return null;
  const min = Math.round((Date.now() - new Date(iso)) / 60000);
  return min < 0 ? 0 : min;
}

function chip(classe, texto, forte, titulo){
  const s = document.createElement('span'); s.className = 'sinal';
  const b = document.createElement('i'); b.className = 'bolha ' + classe;
  s.append(b, document.createTextNode(texto));
  if(forte){ const f = document.createElement('b'); f.textContent = forte; s.append(f); }
  if(titulo) s.title = titulo;
  return s;
}

function pintarSinais(dados){
  const cx = $('#sinais'); cx.replaceChildren();
  const idade = idadeDoBatimento(dados && dados.batimento);
  if(idade === null) return;              /* sem dado: cala. O lema ja ocupa a tela. */

  if(idade > 5){                          /* o executor publica a cada minuto */
    cx.append(chip('ruim', `Mac parado há ${idade} min`, '',
      'O executor publica a cada minuto. Silêncio longo = máquina desligada, dormindo, ' +
      'ou parada na tela de senha.'));
    return;
  }
  for(const [nome, v] of Object.entries(dados.sessoes || {})){
    cx.append(chip({ok:'ok', aviso:'alerta', erro:'ruim'}[v.nivel] || '',
      nome, v.ate, v.nota || (v.ate ? `válido por mais ${v.ate}` : 'sessão viva')));
  }
}

async function carregarSinais(){
  if(demo) return pintarSinais(DEMO_SESSOES);
  try{ pintarSinais(await (await fetch('sessoes.json', {cache:'no-store'})).json()); }
  catch{ pintarSinais(null); }
}

  $('#faz').textContent = (PIPELINES.find(p => p.id === pipeline) || {}).faz || '';
}
function moverPolegar(i){
  $('#polegar').style.transform = `translateX(${i * 100}%)`;
}

PIPELINES.forEach((p, i) => {
  const b = document.createElement('button');
  b.type = 'button'; b.textContent = p.nome;

    pipeline = p.id;
    document.querySelectorAll('#pipes button').forEach(o =>
      o.setAttribute('aria-pressed', o === b));

});

{
  const d = document.createElement('p');

    (cfg.token ? 'Token guardado neste aparelho.' : 'O token ficará guardado neste aparelho.');

carregarFila();
if(!demo){ setInterval(carregarFila, 60000); setInterval(carregarSinais, 60000); }
